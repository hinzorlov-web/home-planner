<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1F5673">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF1F4;--surface:#FFFFFF;--ink:#17212E;--muted:#5F6B7A;--line:#D5DBE2;--accent:#1F5673;--money:#23704F;--must:#B0332A;--must-bg:#FBEDEB;--wait:#9A6A12;--virt:#8A94A3;--chip:#E3E8EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171D;--surface:#1B222B;--ink:#E6EBF1;--muted:#98A3B1;--line:#2E3844;--accent:#7FB6D6;--money:#6CC49A;--must:#F08A80;--must-bg:#3A2220;--wait:#E0B45A;--virt:#6F7A88;--chip:#26303B}}
:root[data-theme="dark"]{--bg:#12171D;--surface:#1B222B;--ink:#E6EBF1;--muted:#98A3B1;--line:#2E3844;--accent:#7FB6D6;--money:#6CC49A;--must:#F08A80;--must-bg:#3A2220;--wait:#E0B45A;--virt:#6F7A88;--chip:#26303B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.brand small[data-s="ok"]{color:var(--money)} .brand small[data-s="error"],.brand small[data-s="warn"]{color:var(--must)} .brand small[data-s="offline"],.brand small[data-s="saving"]{color:var(--wait)}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--muted);font:inherit;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button[aria-current="page"]{background:var(--chip);color:var(--ink);font-weight:600}
.today{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.today input{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.today button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1a24}
.btn.must{border-color:var(--must);color:var(--must)}
.btn:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:11px;background:var(--must);color:#fff;font-size:12px;font-weight:700;text-align:center}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;margin:28px 0 10px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h3{margin:0 0 8px;font-size:14px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:3px 0}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.day{text-align:right;line-height:1.05}
.day b{display:block;font-size:26px;font-weight:600}
.day span{font-size:12px;color:var(--muted)}
.ev{min-width:0}
.ev .t{font-weight:600}
.ev .s{color:var(--muted);font-size:13px}
.ev .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tl li.must .day b{color:var(--must)}
.tl li.must .ev{background:var(--must-bg);border-radius:8px;padding:10px 12px;margin:-4px 0}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.m{background:var(--must);color:#fff}
.tag.w{background:transparent;border:1px solid var(--wait);color:var(--wait)}
.amt{color:var(--money);font-weight:600}
/* tables */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right}
tr.grp td{background:var(--chip);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--chip) 60%,transparent)}
.virt{color:var(--virt);font-style:italic}
.warn{display:inline-flex;margin-left:6px;vertical-align:-2px;cursor:help;color:var(--must)}
tr.late td{background:var(--must-bg)}
.new{color:var(--money)} .gone{color:var(--must)} .chg{color:var(--wait)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;font-size:14px}
.controls input,.controls select{font:inherit;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.cards .panel b{display:block;font-size:20px}
.cards .panel span{font-size:12.5px;color:var(--muted)}
/* modal */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:760px;width:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.45)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mh h3{margin:0;font-size:16px}
.mb{padding:16px 18px;max-height:70vh;overflow:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.f label.w{grid-column:1/-1}
.f input,.f select,.f textarea{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.rows{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px}
.row.prow{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.5fr) auto}
.row>*{min-width:0}.row select,.row input,.row [data-m="tw"]>select{width:100%;min-width:0}
.err{color:var(--must);font-size:13px;margin-top:8px}
.muted{color:var(--muted)}
.chain{margin:6px 0 0;padding:0;list-style:none}
.chain li{padding:6px 0;border-top:1px dashed var(--line)}
textarea.io{width:100%;min-height:160px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand" id="brand">Планер</div>
  <nav id="nav"></nav>
  <div class="today" id="today"></div>
</div></header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<script>
"use strict";
/* ========== utils ========== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pd=s=>new Date(s+"T00:00:00Z");
const iso=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=pd(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate(); // m 0-based
const addMonths=(s,n)=>{const d=pd(s),day=d.getUTCDate();const y=d.getUTCFullYear(),m=d.getUTCMonth()+n;const ny=y+Math.floor(m/12),nm=((m%12)+12)%12;return iso(new Date(Date.UTC(ny,nm,Math.min(day,dim(ny,nm)))))};
const monthStart=s=>s.slice(0,8)+"01";
const fd=s=>s?s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4):"—";
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONF=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const money=n=>(Math.round(n)||0).toLocaleString("ru-RU")+" ₽";
const num=n=>(Math.round(n)||0).toLocaleString("ru-RU");
const pct=v=>(Math.round(v*100)/100).toLocaleString("ru-RU")+"%";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE={deposit:"Вклад",savings:"Накопительный счёт",bond:"Облигация"};
const OWNERS=["Галина","Сергей","Иван"];

/* ========== storage ========== */
let S;
/* ========== сервер (Supabase) и синхронизация ========== */
const SB_URL="https://jvrqdnjvclemooimjwyr.supabase.co",SB_KEY="sb_publishable_sMJ6_D_N2AYvxleohYsuqg_LeijFqL0",ROW="main";
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let SESS=LS.get("hp-session"),DEV=LS.get("hp-device")||{useTestDate:false,testDate:""};
let CACHE=LS.get("hp-cache")||{data:null,version:null,dirty:false};
let SYNC={state:"",msg:""},pushTimer=null,pushing=false,EMPTY_SERVER=false;
let MARKET=LS.get("hp-market")||{};
function mkBond(b){const id=(b.isin||"").trim().toUpperCase();return id&&MARKET.bonds&&MARKET.bonds[id]||null}
function applyMarket(st){ // дополняем облигации датами погашения и оферт с MOEX
  const t0=iso(new Date(Date.now()-30*864e5));
  for(const b of (st.placements||[]))if(b.type==="bond"){const m=mkBond(b);if(!m)continue;
    if(m.maturity)b.maturity=m.maturity;
    const fut=(m.offers||[]).filter(d=>d>=t0);b.offers=[...new Set([...(b.offers||[]),...fut])].sort()}}
async function loadMarket(){try{const r=await rest("market?select=key,data");MARKET=Object.fromEntries((r||[]).map(x=>[x.key,x.data]));LS.set("hp-market",MARKET);applyMarket(S)}catch(e){}}
const saveDev=()=>LS.set("hp-device",DEV);
function emptyState(){return{v:1,settings:{usdRate:90,keyRates:[{from:"2025-01-01",value:15.5}]},placements:[],events:[],acks:{}}}
function normalize(d){d=d&&typeof d==="object"?d:emptyState();d.settings=d.settings||{};d.settings.usdRate=d.settings.usdRate||90;d.settings.keyRates=d.settings.keyRates&&d.settings.keyRates.length?d.settings.keyRates:[{from:"2025-01-01",value:15.5}];
  delete d.settings.testDate;delete d.settings.useTestDate;d.placements=d.placements||[];d.events=d.events||[];d.acks=d.acks||{};return d}
async function authCall(path,body){const r=await fetch(SB_URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.msg||j.error_description||j.message||("HTTP "+r.status)),{status:r.status});return j}
function setSession(j){SESS={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user.id,email:j.user.email}};LS.set("hp-session",SESS)}
async function signIn(email,password){setSession(await authCall("token?grant_type=password",{email,password}))}
async function token(){if(!SESS)throw Object.assign(new Error("no session"),{auth:true});
  if(Date.now()/1000>SESS.expires_at-60){try{setSession(await authCall("token?grant_type=refresh_token",{refresh_token:SESS.refresh_token}))}
    catch(e){if(e.status&&e.status<500){SESS=null;LS.del("hp-session");render();throw Object.assign(e,{auth:true})}throw e}}
  return SESS.access_token}
function signOut(){if(CACHE.dirty&&!confirm("Есть изменения, которые ещё не сохранены на сервере. Всё равно выйти? Они пропадут."))return;
  SESS=null;LS.del("hp-session");LS.del("hp-cache");CACHE={data:null,version:null,dirty:false};S=emptyState();render()}
async function rest(path,opt={}){const t=await token();
  const r=await fetch(SB_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SB_KEY,Authorization:"Bearer "+t,"Content-Type":"application/json",...(opt.headers||{})}});
  if(r.status===401){SESS=null;LS.del("hp-session");render();throw Object.assign(new Error("401"),{auth:true})}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok)throw Object.assign(new Error((j&&j.message)||("HTTP "+r.status)),{status:r.status});return j}
function setSync(state,msg){SYNC={state,msg};const el=$("#sync");if(el){el.textContent=msg;el.dataset.s=state}}
function save(){CACHE={data:S,version:CACHE.version,dirty:true};LS.set("hp-cache",CACHE);clearTimeout(pushTimer);pushTimer=setTimeout(push,700);setSync("saving","сохраняю…")}
async function push(){if(pushing||!SESS||!CACHE.dirty)return;if(!navigator.onLine){setSync("offline","нет сети — сохранено на устройстве");return}
  pushing=true;let conflictRow=null;
  try{const body={data:S,updated_by:SESS.user.id,updated_at:new Date().toISOString()};
    if(CACHE.version==null){try{const r=await rest("family_state",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({id:ROW,version:1,...body})});CACHE.version=r[0].version}
      catch(e){if(e.status===409){conflictRow=true}else throw e}}
    else{const r=await rest(`family_state?id=eq.${ROW}&version=eq.${CACHE.version}`,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({...body,version:CACHE.version+1})});
      if(!r||!r.length)conflictRow=true;else CACHE.version=r[0].version}
    if(!conflictRow){CACHE.dirty=false;CACHE.data=S;LS.set("hp-cache",CACHE);EMPTY_SERVER=false;setSync("ok","синхронизировано")}
  }catch(e){if(!e.auth)setSync("error","сервер недоступен — повторю позже")}finally{pushing=false}
  if(conflictRow)await conflict()}
async function conflict(){ // данные изменились на другом устройстве
  try{const r=await rest(`family_state?id=eq.${ROW}&select=data,version`);const row=r&&r[0];if(!row)return;
    LS.set("hp-conflict-backup",{at:new Date().toISOString(),data:S});
    CACHE={data:row.data,version:row.version,dirty:false};LS.set("hp-cache",CACHE);S=normalize(row.data);if(dlg.open)dlg.close();Q=[];render();setSync("warn","загружены свежие данные");
    alert("Пока вы вносили изменение, данные изменились на другом устройстве. Загружены свежие данные — внесите ваше последнее изменение ещё раз.")}catch(e){}}
async function pull(){if(!SESS||pushing||dlg.open)return;if(CACHE.dirty)return push();
  if(!navigator.onLine){setSync("offline","нет сети — данные с устройства");return}
  try{const r=await rest(`family_state?id=eq.${ROW}&select=data,version`);const row=r&&r[0];
    if(!row){EMPTY_SERVER=true;CACHE.version=null;setSync("ok","на сервере пока нет данных");render();return}
    EMPTY_SERVER=false;
    if(row.version!==CACHE.version){CACHE={data:row.data,version:row.version,dirty:false};LS.set("hp-cache",CACHE);S=normalize(row.data)}
    await loadMarket();render();
    setSync("ok","синхронизировано")}catch(e){if(!e.auth)setSync("error","сервер недоступен — данные с устройства")}}
const MOBILE=/iPhone|iPod|Android/i.test(navigator.userAgent); // на телефоне — только просмотр ленты событий
const PUSH_OK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
function b64u(s){const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function deviceName(){const u=navigator.userAgent;const os=/iPhone|iPad/.test(u)?"iPhone/iPad":/Mac/.test(u)?"Mac":/Windows/.test(u)?"Windows":/Android/.test(u)?"Android":"устройство";
  const br=/Edg\//.test(u)?"Edge":/Chrome\//.test(u)?"Chrome":/Safari\//.test(u)?"Safari":/Firefox\//.test(u)?"Firefox":"браузер";return os+" · "+br}
async function pushStatus(){if(!PUSH_OK())return"unsupported";if(Notification.permission==="denied")return"denied";
  const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();return sub?"on":"off"}
async function pushEnable(level){const key=MARKET.vapid&&MARKET.vapid.publicKey;if(!key)throw new Error("На сервере ещё нет ключа уведомлений: один раз запустите задачу «Ежедневная рассылка» в GitHub (режим test).");
  const perm=await Notification.requestPermission();if(perm!=="granted")throw new Error("Уведомления не разрешены в браузере.");
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
  const j=sub.toJSON();await rest("push_subscriptions?on_conflict=endpoint",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify({user_id:SESS.user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,device:deviceName(),level:level||"all"})})}
async function pushLevel(){const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(!sub)return null;
  const r=await rest("push_subscriptions?select=level&endpoint=eq."+encodeURIComponent(sub.endpoint));return r&&r[0]?r[0].level:"all"}
async function pushSetLevel(level){const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(!sub)return;
  await rest("push_subscriptions?endpoint=eq."+encodeURIComponent(sub.endpoint),{method:"PATCH",body:JSON.stringify({level})})}
async function pushDisable(){const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(!sub)return;
  try{await rest("push_subscriptions?endpoint=eq."+encodeURIComponent(sub.endpoint),{method:"DELETE"})}catch(e){}await sub.unsubscribe()}
async function pushLocalTest(){const reg=await navigator.serviceWorker.ready;await reg.showNotification("Планер: проверка",{body:"Браузер показывает уведомления этого приложения ("+new Date().toLocaleTimeString("ru-RU")+").",tag:"local-test",renotify:true})}
function updateBadge(){try{const n=mustCount();if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}
function downloadFile(name,text,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
/* ========== test data: срез на февраль 2026 ========== */
/* ========== engine ========== */
const realToday=()=>iso(new Date(Date.now()+3*3600e3)); // московская дата
const today=()=>DEV.useTestDate&&DEV.testDate?DEV.testDate:realToday();
const P=id=>S.placements.find(p=>p.id===id);
function allKeyRates(){const auto=(MARKET.rates&&MARKET.rates.keyRates)||[];if(!auto.length)return S.settings.keyRates;
  const last=auto.reduce((m,x)=>x.from>m?x.from:m,"");return[...auto,...S.settings.keyRates.filter(x=>x.from>last)]}
function KS(d){const k=[...allKeyRates()].sort((a,b)=>a.from<b.from?-1:1);let v=k[0]?k[0].value:0;for(const e of k)if(e.from<=d)v=e.value;return v}
const tEnd=t=>t.target||t.end||null;
function rateEntry(t,d){const r=[...t.rates].sort((a,b)=>a.from<b.from?-1:1);let e=r[0];for(const x of r)if(x.from<=d)e=x;return e}
function rateAt(t,d){const e=rateEntry(t,d);if(!e)return 0;if(e.kind==="ks")return KS(d)+e.spread;if(e.kind==="sav")return e.value+(KS(d)-KS(e.from));return e.value}
function rateIsEst(t,d){const e=rateEntry(t,d);return e&&e.kind==="sav"&&KS(d)!==KS(e.from)}
function amountAt(p,t,d){let a=t.amount;for(const o of p.ops)if(o.trancheId===t.id&&o.date<=d)a+=o.kind==="topup"?o.amount:-o.amount;return a}
function activeTranche(p,d){return p.tranches.find(t=>t.incomplete&&!t.open?(!t.closed||d<t.closed.date):(t.open<=d&&(!tEnd(t)||d<tEnd(t))&&!(t.closed&&t.closed.date<=d)))}
function usdRate(){return(MARKET.rates&&MARKET.rates.usd&&MARKET.rates.usd.rate)||S.settings.usdRate}
function fx(p){return p.currency==="USD"?usdRate():1}
function qtyAt(b,d){let q=b.qty0;for(const o of b.ops)if(o.date<=d)q+=o.kind==="buy"?o.qty:-o.qty;return q}
function couponSchedule(b){
  const m=mkBond(b);if(m&&m.coupons&&m.coupons.length){let last=null;const out=[];
    for(const c of [...m.coupons].sort((x,y)=>x.date<y.date?-1:1)){if(c.value!=null)last=c.value;const v=c.value!=null?c.value:(last!=null?last:(b.coupons[0]&&b.coupons[0].perBond)||0);out.push({date:c.date,perBond:v,est:c.value==null})}
    return out.filter(x=>!b.maturity||x.date<=b.maturity)}
  const c=[...b.coupons].sort((x,y)=>x.date<y.date?-1:1);if(!c.length)return c;
  const out=c.map(x=>({...x}));let last=out[out.length-1];const step=12/b.freq;
  const lim=b.maturity||addMonths(last.date,48);let d=addMonths(last.date,step);
  while(d<=lim){out.push({date:d,perBond:last.perBond,est:true});d=addMonths(d,step)}
  return out.filter(x=>!b.maturity||x.date<=b.maturity);
}
function bondActive(b,d){return b.since<=d&&qtyAt(b,d)>0&&(!b.maturity||d<b.maturity)&&!(b.closed&&b.closed.date<=d)}
function trancheLabel(p,t){return p.bank+" · "+p.owner}
function payDayOf(t,y,m){return t.payDay==="last"?dim(y,m):Math.min(+t.payDay,dim(y,m))}
function payDates(t,from,to){ // interest payment dates for deposit/savings tranche within [from,to]
  if(!t.open)return[];const out=[],e=tEnd(t),f=t.payFreq||1;let k=1,d;
  let first=null;
  if(t.payDay){const o=pd(t.open);let y=o.getUTCFullYear(),m=o.getUTCMonth();first=iso(new Date(Date.UTC(y,m,payDayOf(t,y,m))));
    if(first<=t.open){m++;if(m>11){m=0;y++}first=iso(new Date(Date.UTC(y,m,payDayOf(t,y,m))))}}
  const nth=n=>{if(!t.payDay)return addMonths(t.open,n*f);const b=pd(first);let y=b.getUTCFullYear(),m=b.getUTCMonth()+(n-1)*f;y+=Math.floor(m/12);m%=12;return iso(new Date(Date.UTC(y,m,payDayOf(t,y,m))))};
  d=nth(k);while(d<=to&&(!e||d<=e)){if(d>=from)out.push(d);d=nth(++k)}
  if(e&&e>=from&&e<=to&&!out.includes(e))out.push(e);return out;
}
function accrued(p,t,from,to){ // проценты за дни [from, to): сумма × ставка / 12 / дней в месяце — как в прогнозе
  let v=0;for(let d=from;d<to;d=addDays(d,1)){const x=pd(d);v+=amountAt(p,t,d)*rateAt(t,d)/100/12/dim(x.getUTCFullYear(),x.getUTCMonth())}return v}
const payDayText=t=>!t.payDay?(t.open?"в день открытия ("+(+t.open.slice(8,10))+"-го)":"в день открытия"):t.payDay==="last"?"в последний день месяца":t.payDay+"-го числа";
</script>
<script>
"use strict";
/* ========== events ========== */
function mState(date,key,t0){
  const a=S.acks[key];if(a&&!a.snooze)return null;
  const R1=addDays(monthStart(date),-2),R2=addDays(date,-1);
  if(a&&a.snooze)return{active:t0>=a.snooze,fires:t0>=a.snooze,overdue:t0>date,snoozed:t0<a.snooze?a.snooze:null};
  return{active:t0>=R1,fires:t0===R1||t0===R2||t0>date,overdue:t0>date};
}
function moneyState(date,key,t0){if(S.acks[key]&&!S.acks[key].snooze)return null;const sn=S.acks[key]&&S.acks[key].snooze;const d=sn||date;return{active:t0>=d,fires:t0>=d,overdue:false}}
function buildEvents(t0,horizon=60){
  const to=addDays(t0,horizon),L=[];
  const M=(o)=>{if(o.st&&(o.st.active||o.date<=to))L.push({...o,cls:"must"})};
  for(const p of S.placements){
    if(p.type!=="bond"){
      for(const t of p.tranches){
        if(t.incomplete&&!t.closed)L.push({cls:"info",kind:"inc",date:t0,p,t,title:"Неполные данные: "+p.bank,sub:"Не хватает дат или ставки — заполните карточку"});
        const e=tEnd(t);
        if(e&&!t.closed){const key="end:"+t.id;M({kind:"end",key,date:e,p,t,st:mState(e,key,t0),title:(p.type==="savings"?"Закрытие счёта: ":"Окончание вклада: ")+p.bank,sub:p.owner+" · "+money(amountAt(p,t,e))+(t.target&&t.end&&t.target!==t.end?" · по договору до "+fd(t.end):"")})}
        if(t.closed&&t.closed.via!=="prolong"&&!t.closed.answer){const key="money:"+t.id,d=addDays(t.closed.date,3);M({kind:"money",key,date:d,p,t,st:moneyState(d,key,t0),title:"Что стало с деньгами? "+p.bank,sub:p.owner+" · закрыт "+fd(t.closed.date)+" · "+money(amountAt(p,t,t.closed.date))})}
        if(!t.closed||t.closed.date>t0){const all=t.open?payDates(t,t.open,to):[];all.forEach((d,i)=>{if(d<t0||(t.closed&&d>t.closed.date))return;const prev=i?all[i-1]:t.open,v=accrued(p,t,prev,d),days=Math.round((pd(d)-pd(prev))/864e5);
          L.push({cls:"info",kind:"pay",date:d,p,t,amount:v,title:"Проценты: "+p.bank,sub:p.owner+" · ставка "+pct(rateAt(t,d))+(rateIsEst(t,d)?" (оценка)":"")+" · за "+days+" дн. с "+fd(prev)})})}
      }
      if(p.type==="savings"){const t=p.tranches.find(x=>!x.closed);if(t){let d=monthStart(addMonths(t0,0));if(d<t0)d=addMonths(d,1);for(;d<=to;d=addMonths(d,1)){const key="chk:"+p.id+":"+d.slice(0,7);if(S.acks[key])continue;L.push({cls:"info",kind:"chk",key,date:d,p,t,title:"Проверить ставку: "+p.bank,sub:"В приложении: "+pct(rateAt(t,d))+(rateIsEst(t,d)?" (оценка от КС)":"")})}}}
    }else if(!p.closed){
      for(const c of couponSchedule(p))if(c.date>=t0&&c.date<=to&&qtyAt(p,c.date)>0)L.push({cls:"info",kind:"cpn",date:c.date,p,amount:c.perBond*qtyAt(p,c.date)*fx(p),title:"Купон: "+p.name,sub:num(qtyAt(p,c.date))+" шт. × "+c.perBond+(p.currency==="USD"?" USD":" ₽")+(c.est||p.floating?" · сумма оценочная":"")});
      for(const o of p.offers){const key="offer:"+p.id+":"+o,d=addDays(o,-7);M({kind:"offer",key,date:d,p,st:mState(d,key,t0),title:"Оферта "+fd(o)+": "+p.name,sub:"Решите: оставить или предъявить к выкупу. Заявку брокеру обычно подают за 5–10 дней до оферты"})}
      if(p.maturity){const key="mat:"+p.id;M({kind:"mat",key,date:p.maturity,p,st:mState(p.maturity,key,t0),title:"Погашение: "+p.name,sub:money(qtyAt(p,p.maturity)*p.nominal*fx(p))})}
    }else if(!p.closed.answer){const key="money:"+p.id,d=addDays(p.closed.date,3);M({kind:"money",key,date:d,p,st:moneyState(d,key,t0),title:"Что стало с деньгами? "+p.name,sub:"Погашена/продана "+fd(p.closed.date)+" · "+money(qtyAt(p,p.closed.date)*p.nominal*fx(p))})}
  }
  for(const e of S.events){const p=e.pid?P(e.pid):null;
    if(e.cls==="must"){const key="man:"+e.id;M({kind:"man",key,date:e.date,p,st:mState(e.date,key,t0),title:e.text,sub:p?p.bank+" · "+p.owner:"Своё событие"})}
    else if(e.date>=t0&&e.date<=to)L.push({cls:"info",kind:"mani",date:e.date,p,title:e.text,sub:p?p.bank+" · "+p.owner:"Своё событие"});}
  const ks=[...S.settings.keyRates].sort((a,b)=>a.from<b.from?-1:1);
  ks.forEach((k,i)=>{if(i>0&&k.from>=addDays(t0,-7)&&k.from<=to)L.push({cls:"info",kind:"ks",date:k.from,title:"Ключевая ставка: "+pct(ks[i-1].value)+" → "+pct(k.value),sub:"Сверьте ставки накопительных счетов и плавающих вкладов с банками"})});
  L.sort((a,b)=>{const am=a.cls==="must"&&a.st.active,bm=b.cls==="must"&&b.st.active;if(am!==bm)return am?-1:1;return a.date<b.date?-1:a.date>b.date?1:0});
  return L;
}
const mustCount=()=>buildEvents(today()).filter(e=>e.cls==="must"&&e.st.active).length;

/* ========== forecast ========== */
function lastEnded(p,d){let best=null,bd="";for(const t of p.tranches){const e=t.closed?t.closed.date:tEnd(t);if(e&&e<=d&&e>bd){bd=e;best=t}}return best?{t:best,e:bd}:null}
function forecast(Y){
  const rows=[];
  for(const p of S.placements){
    const vals=Array(12).fill(0),virt=Array(12).fill(0);let est=false;
    if(p.type!=="bond"){
      for(let m=0;m<12;m++){const n=dim(Y,m);for(let day=1;day<=n;day++){
        const d=Y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
        const t=activeTranche(p,d);
        if(t){vals[m]+=amountAt(p,t,d)*rateAt(t,d)/100/12/n;if(rateIsEst(t,d)||t.incomplete)est=true;continue}
        const le=lastEnded(p,d);if(!le)continue;const lt=le.t;
        if(lt.closed&&lt.closed.answer)continue; // деньги распределены — считаются в новых размещениях
        if(p.tranches.some(x=>x.prevId===lt.id&&x.open<=d))continue;
        const dd=addDays(le.e,-1);virt[m]+=amountAt(p,lt,dd)*rateAt(lt,dd)/100/12/n;
      }}
    }else{
      const sch=couponSchedule(p);
      for(const c of sch){if(c.date.slice(0,4)!==String(Y))continue;if(c.date<p.since)continue;if(p.closed&&c.date>p.closed.date)continue;const q=qtyAt(p,c.date);if(q<=0)continue;vals[+c.date.slice(5,7)-1]+=c.perBond*q*fx(p);if(c.est||p.floating)est=true}
      const endD=p.closed?p.closed.date:p.maturity;
      if(endD&&!(p.closed&&p.closed.answer)&&endD<=Y+"-12-31"){
        const lastC=sch.length?sch[sch.length-1].perBond:0,y=lastC*p.freq/p.nominal,base=qtyAt(p,addDays(endD,-1))*p.nominal*fx(p);
        for(let m=0;m<12;m++){const n=dim(Y,m);for(let day=1;day<=n;day++){const d=Y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");if(d>=endD)virt[m]+=base*y/12/n}}
      }
    }
    const tot=vals.reduce((a,b)=>a+b,0)+virt.reduce((a,b)=>a+b,0);
    if(tot>0.5)rows.push({p,vals,virt,est,tot});
  }
  return rows;
}

/* ========== portfolio ========== */
function portfolio(D){
  const rows=[];
  for(const p of S.placements){
    if(p.type!=="bond"){const t=activeTranche(p,D);
      if(t){rows.push({p,t,key:p.id,amount:amountAt(p,t,D),rate:rateAt(t,D),est:rateIsEst(t,D),open:t.open,end:tEnd(t)});continue}
      const le=lastEnded(p,D);if(!le)continue;const lt=le.t;
      if(lt.closed&&(lt.closed.answer||lt.closed.via==="prolong"))continue;
      const dd=addDays(le.e,-1);
      rows.push({p,t:lt,key:p.id,amount:amountAt(p,lt,dd),rate:rateAt(lt,dd),est:rateIsEst(lt,dd),open:lt.open,end:le.e,warn:lt.closed?"money":"overdue"});
    }else{
      if(bondActive(p,D)){const sch=couponSchedule(p);const c=sch.find(x=>x.date>=D)||sch[sch.length-1];rows.push({p,key:p.id,amount:qtyAt(p,D)*p.nominal*fx(p),rate:c?c.perBond*p.freq/p.nominal*100:0,est:p.floating,open:p.since,end:p.maturity,qty:qtyAt(p,D)});continue}
      const endD=p.closed?p.closed.date:p.maturity;
      if(!endD||endD>D||p.since>D||(p.closed&&p.closed.answer))continue;
      const q=qtyAt(p,addDays(endD,-1));if(q<=0)continue;
      rows.push({p,key:p.id,amount:q*p.nominal*fx(p),rate:0,est:false,open:p.since,end:endD,qty:q,warn:p.closed?"money":"overdue"});
    }
  }
  return rows;
}

<script>

function vEvents(){
  const t0=today(),L=buildEvents(t0);
  const js=MARKET.jobstatus,stale=js&&js.lastDailyDate&&js.lastDailyDate<addDays(realToday(),-1);

  for(const e of ev){const d=e.date.replace(/-/g,""),d2=addDays(e.date,1).replace(/-/g,"");
    const desc=[e.sub,e.kind==="end"?"Отметьте в приложении: пролонгирован или закрыт.":e.kind==="offer"?"Решите: оставить облигации или предъявить к выкупу.":e.kind==="mat"?"Погашение: отметьте в приложении, что стало с деньгами.":"Отметьте в приложении, что сделано."].filter(Boolean).join("\n");

    for(const [tr,label] of [["-P6DT15H","через 7 дней"],["-P2DT15H","через 3 дня"],["-PT15H","завтра"]])L.push("BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:"+tr,"DESCRIPTION:"+icsEsc(label+": "+e.title),"END:VALARM");

function crc32(b){let c,crc=-1;for(let i=0;i<b.length;i++){c=(crc^b[i])&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return(crc^-1)>>>0}
function makeZip(fname,data){ // один файл без сжатия (stored)
  const name=new TextEncoder().encode(fname),crc=crc32(data),n=new Date(),dt=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate(),tm=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1);

  lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(10,tm,true);lv.setUint16(12,dt,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);loc.set(name,30);
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(12,tm,true);cv.setUint16(14,dt,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cen.set(name,46);

  <div class="panel"><h3>Вход</h3><p style="margin:0 0 8px">Вы вошли как <b>${esc(SESS.user.email)}</b></p><button class="btn" id="lo">Выйти</button></div>
  </div><div style="display:flex;flex-direction:column;gap:16px">
  <div class="panel"><h3>Резервная копия</h3><p class="muted" style="margin:0 0 10px;font-size:13px">«Выгрузить» сохраняет все данные в файл в папку «Загрузки». «Загрузить» заменяет текущие данные данными из файла.</p>
  <div class="controls" style="margin:0"><button class="btn primary" id="dl">Выгрузить в файл</button><button class="btn" id="ul">Загрузить из файла</button><input type="file" id="ulf" accept=".json,.txt,application/json,text/plain" hidden></div><div id="dlmsg" class="muted" style="font-size:13px;margin-top:8px"></div>
  <details style="margin-top:10px"><summary class="muted" style="font-size:13px;cursor:pointer">Вручную, через текст</summary><textarea class="io" id="io" style="margin-top:8px"></textarea>
  <div class="controls" style="margin:8px 0 0"><button class="btn" id="exp">Показать данные</button><button class="btn" id="imp">Загрузить текст</button></div></details></div>
  </div></div>`;
  $("#ksa").onclick=()=>{const d=$("#ksd").value,v=parseFloat($("#ksv").value);if(!d||isNaN(v))return;s.keyRates.push({from:d,value:v});save();render()};
  $("#usds").onclick=()=>{const v=parseFloat($("#usd").value);if(v>0){s.usdRate=v;save();render()}};
  $("#ut").onchange=e=>{DEV.useTestDate=e.target.checked;if(!DEV.testDate)DEV.testDate=realToday();saveDev();render()};
  $("#lo").onclick=signOut;
  initPushPanel();
  const setMsg=m=>{$("#dlmsg").textContent=m};
  $("#dl").onclick=()=>{const name="vklady-"+realToday()+".json";downloadFile(name,JSON.stringify(S,null,1),"application/json");setMsg("Файл "+name+" сохранён в «Загрузки».")};
  $("#ul").onclick=()=>$("#ulf").click();
  $("#ulf").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.placements)throw 0;if(!confirm("Заменить текущие данные данными из файла «"+f.name+"»?"))return;S=normalize(o);save();render();setMsg("Данные загружены из «"+f.name+"» и отправлены на сервер.")}catch(x){setMsg("Файл не похож на выгрузку этого приложения.")}};rd.readAsText(f)};
  $("#exp").onclick=()=>{$("#io").value=JSON.stringify(S,null,1);$("#io").select()};
  $("#imp").onclick=()=>{try{const o=JSON.parse($("#io").value);if(!o.placements)throw 0;S=normalize(o);save();render()}catch(e){alert("Не удалось прочитать данные: проверьте, что вставлен текст целиком.")}};

}
</script>
<script>
"use strict";
/* ========== modal helpers ========== */
const dlg=$("#dlg");let Q=[];
function pendingToEvents(){const texts=[dlg.dataset.pending,...Q.map(f=>f.pending)].filter(Boolean);
  for(const t of texts)S.events.push({id:uid(),date:today(),cls:"must",text:t,pid:null});if(texts.length)save();dlg.dataset.pending=""}
function modal(title,body,onSave,saveLabel="Сохранить"){dlg.dataset.pending="";
  dlg.innerHTML=`<div class="mh"><h3>${esc(title)}</h3><button class="btn" data-x>Закрыть</button></div><div class="mb">${body}<div class="err" id="merr"></div></div>${onSave?`<div class="mf"><button class="btn" data-x>Отмена</button><button class="btn primary" id="msave">${saveLabel}</button></div>`:""}`;
  dlg.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{pendingToEvents();dlg.close();Q=[];render()});
  dlg.oncancel=()=>{pendingToEvents();Q=[];setTimeout(render,0)};
  if(onSave)$("#msave").onclick=()=>{const err=onSave();if(err){$("#merr").textContent=err;return}dlg.dataset.pending="";save();dlg.close();render();if(Q.length){const f=Q.shift();setTimeout(f,60)}};
  if(!dlg.open)dlg.showModal();
}
const fv=n=>{const e=dlg.querySelector(`[name="${n}"]`);return e?(e.type==="checkbox"?e.checked:e.value.trim()):""};
const fnum=n=>{const v=parseFloat(String(fv(n)).replace(/\s/g,"").replace(",","."));return isNaN(v)?null:v};
const ownerSel=(v)=>`<select name="owner">${OWNERS.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
const payDaySel=v=>`<select name="payDay"><option value="">в день открытия вклада</option>${Array.from({length:31},(_,i)=>i+1).map(n=>`<option value="${n}" ${String(v)===String(n)?"selected":""}>${n}-го числа</option>`).join("")}<option value="last" ${v==="last"?"selected":""}>в последний день месяца</option></select>`;
function rateRow(r){return`<div class="row"><input type="date" data-r="from" value="${r.from&&r.from>"2000-01-01"?r.from:""}"><select data-r="kind"><option value="fixed" ${r.kind!=="ks"?"selected":""}>Фиксированная, %</option><option value="ks" ${r.kind==="ks"?"selected":""}>КС ± спред, п.п.</option></select><input type="number" step="0.01" data-r="val" value="${r.kind==="ks"?r.spread:(r.value??"")}" placeholder="${r.kind==="ks"?"напр. −0,8":"напр. 16"}"><button class="btn" type="button" data-rdel title="Удалить период">×</button></div>`}
function rateBlock(rates){return`<div class="rows"><span class="muted" style="font-size:12.5px">Ставка по периодам (для ступенчатой — несколько строк с датами начала)</span><div id="rrows">${rates.map(rateRow).join("")}</div><div><button class="btn" type="button" id="radd">+ период ставки</button></div></div>`}
function wireRates(){const box=$("#rrows");const wire=()=>box.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{if(box.children.length>1)b.parentElement.remove()});wire();
  $("#radd").onclick=()=>{box.insertAdjacentHTML("beforeend",rateRow({kind:"fixed"}));wire()}}
function collectRates(defFrom){const out=[];for(const r of $("#rrows").children){const from=r.querySelector('[data-r="from"]').value||defFrom,kind=r.querySelector('[data-r="kind"]').value,v=parseFloat(r.querySelector('[data-r="val"]').value.replace(",","."));if(isNaN(v))continue;out.push(kind==="ks"?{from,kind,spread:v}:{from,kind:"fixed",value:v})}
  if(out.length)out.sort((a,b)=>a.from<b.from?-1:1),out[0].from=defFrom<out[0].from?defFrom:out[0].from;return out}
function trancheFields(t,p,withBank){return`<div class="f">
  ${withBank?`<label>Банк<input name="bank" value="${esc(p?p.bank:"")}"></label><label>Владелец${ownerSel(p?p.owner:"Галина")}</label>`:""}
  <label>Дата открытия<input type="date" name="open" value="${t.open||""}"></label>
  <label>Дата окончания по договору<input type="date" name="end" value="${t.end||""}"></label>
  <label>Забрать раньше, в дату (необязательно)<input type="date" name="target" value="${t.target||""}"></label>
  <label>Сумма, ₽<input name="amount" inputmode="decimal" value="${t.amount??""}"></label>
  <label>Выплата процентов<select name="payFreq"><option value="1">ежемесячно</option><option value="3" ${t.payFreq===3?"selected":""}>ежеквартально</option></select></label><label>День выплаты процентов${payDaySel(t.payDay||"")}</label>
  ${rateBlock(t.rates&&t.rates.length?t.rates:[{kind:"fixed"}])}
  ${withBank?`<label class="w">Заметки<textarea name="notes" rows="2">${esc(p?p.notes:"")}</textarea></label>`:""}</div>`}
function readTranche(){const open=fv("open")||null,end=fv("end")||null,amount=fnum("amount");if(!amount)return{err:"Укажите сумму."};
  const rates=collectRates(open||"2000-01-01");if(!rates.length)return{err:"Укажите ставку."};
  if(open&&end&&end<=open)return{err:"Дата окончания должна быть позже даты открытия."};
  return{open,end,target:fv("target")||null,amount,payFreq:+fv("payFreq")||1,payDay:fv("payDay")||null,rates,incomplete:!open||!end}}


/* ========== distribution of money (parts) ========== */
const PARTK={new:"новое размещение",spent:"потрачено",topup:"пополнение"};
const partsText=parts=>parts.map(x=>PARTK[x.kind]+" "+money(x.amount)).join(", ");
function partsUI(total,excludePid){
  const targets=S.placements.filter(x=>x.id!==excludePid&&x.type!=="bond"&&activeTranche(x,today()));
  window._partThird=k=>k==="topup"?(targets.length?`<select data-m="t" aria-label="Какой счёт пополнен">${targets.map(x=>`<option value="${x.id}">${esc(x.bank)} · ${x.owner}</option>`).join("")}</select>`:`<span class="muted" style="font-size:12.5px;align-self:center">нет открытых счетов</span>`):k==="new"?`<span class="muted" style="font-size:12.5px;align-self:center">тип, банк и владелец — на следующем шаге</span>`:`<span></span>`;
  window._partRow=(k,a)=>`<div class="row prow"><select data-m="k" aria-label="Что стало с частью денег"><option value="new" ${k==="new"?"selected":""}>Новый вклад, счёт или облигации</option><option value="spent" ${k==="spent"?"selected":""}>Потрачено</option><option value="topup" ${k==="topup"?"selected":""}>Пополнение существующего счёта</option></select><input data-m="a" inputmode="decimal" value="${a??""}" placeholder="сумма" aria-label="Сумма"><div data-m="tw" style="display:flex">${_partThird(k)}</div><button class="btn" type="button" data-mdel title="Удалить часть">×</button></div>`;
  return`<div class="rows" id="mrows">${_partRow("new",total)}</div><div style="margin-top:8px"><button class="btn" type="button" id="madd">+ часть</button></div><p class="muted" style="font-size:13px">Для нового размещения после сохранения откроется форма: там выбираются тип (вклад, счёт или облигации), банк, владелец, даты и ставка.</p>`}
function wireParts(){const box=$("#mrows");const wire=()=>{box.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{if(box.children.length>1)b.parentElement.remove()});
    box.querySelectorAll('[data-m="k"]').forEach(sel=>sel.onchange=()=>{sel.parentElement.querySelector('[data-m="tw"]').innerHTML=_partThird(sel.value)})};wire();
  $("#madd").onclick=()=>{box.insertAdjacentHTML("beforeend",_partRow("spent",""));wire()}}
function readParts(total){
  const parts=[...$("#mrows").children].map(r=>({kind:r.querySelector('[data-m="k"]').value,amount:parseFloat(r.querySelector('[data-m="a"]').value.replace(/\s/g,"").replace(",",".")),target:(r.querySelector('[data-m="t"]')||{}).value||""}));
  if(parts.some(x=>isNaN(x.amount)||x.amount<=0))return{err:"Укажите сумму каждой части."};
  const s=parts.reduce((a,b)=>a+b.amount,0);if(Math.abs(s-total)>1)return{err:`Сумма частей ${money(s)} не равна ${money(total)}.`};
  if(parts.some(x=>x.kind==="topup"&&!x.target))return{err:"Нет счёта для пополнения — выберите другой вариант."};
  return{parts}}
function applyParts(parts,owner,date,src){for(const x of parts){
  if(x.kind==="topup"){const tp=P(x.target),tt=activeTranche(tp,today());tp.ops.push({id:uid(),trancheId:tt.id,date,kind:"topup",amount:x.amount})}
  if(x.kind==="new"){const pend=`Внести новое размещение на ${money(x.amount)} (деньги из «${src||""}», ${fd(date)})`;const f=()=>A.newPlacement({amount:x.amount,owner,open:date,pending:pend});f.pending=pend;Q.push(f)}}}
/* ========== actions ========== */
const A={
  ack(key,answer){S.acks[key]={answer,at:today()};save();render()},
  snooze(key){modal("Отложить напоминание",`<div class="f"><label>Напомнить снова<input type="date" name="d" value="${addDays(today(),3)}"></label></div>`,()=>{const d=fv("d");if(!d||d<=today())return"Выберите дату позже сегодняшней.";S.acks[key]={snooze:d}},"Отложить")},
  newPlacement(pre={}){
    const draw=type=>{const body=`<div class="f"><label class="w">Что открыто<select name="type" id="ptype">${Object.entries(TYPE).map(([k,l])=>`<option value="${k}" ${k===type?"selected":""}>${l}</option>`).join("")}</select></label></div><div style="height:10px"></div>`+
      (type==="deposit"?trancheFields({amount:pre.amount,open:pre.open||today()},{owner:pre.owner||"Галина",bank:"",notes:""},true):
       type==="savings"?`<div class="f"><label>Банк и название счёта<input name="bank"></label><label>Владелец${ownerSel(pre.owner||"Галина")}</label><label>Дата открытия<input type="date" name="open" value="${pre.open||today()}"></label><label>Сумма, ₽<input name="amount" inputmode="decimal" value="${pre.amount??""}"></label><label>Тип ставки<select name="rk"><option value="sav">Ставка банка, % (банк меняет сам)</option><option value="ks">Ключевая ставка ± спред, п.п.</option></select></label><label>Ставка, % — или спред к КС, п.п. (напр. −1)<input name="rate" inputmode="decimal"></label><label>День выплаты процентов${payDaySel("")}</label><label></label><label class="w">Заметки (например, до какой даты действует промо-ставка)<textarea name="notes" rows="2"></textarea></label></div>`:
       `<div class="f"><label>Выпуск<input name="name" placeholder="напр. ОФЗ 26240"></label><label>ISIN (для автоподгрузки на этапе 2)<input name="isin"></label><label>Владелец${ownerSel(pre.owner||"Сергей")}</label><label>Количество, шт.<input name="qty" inputmode="numeric"></label><label>Номинал<input name="nominal" value="1000"></label><label>Валюта<select name="cur"><option>RUB</option><option>USD</option></select></label><label>Ближайший купон, дата<input type="date" name="cdate"></label><label>Купон на бумагу<input name="cpn" inputmode="decimal"></label><label>Купонов в год<select name="freq"><option>2</option><option>4</option><option>12</option><option>1</option></select></label><label>Погашение<input type="date" name="mat"></label><label>Оферта (если есть)<input type="date" name="offer"></label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="fl"> плавающий купон (сумма оценочная)</label></div>`);
      modal("Новое размещение",body,()=>{
        const tp=fv("type");
        if(tp==="deposit"){const bank=fv("bank");if(!bank)return"Укажите банк.";const r=readTranche();if(r.err)return r.err;
          S.placements.push({id:uid(),type:"deposit",bank,owner:fv("owner"),currency:"RUB",notes:fv("notes"),tranches:[{id:uid(),...r,prevId:pre.prevId||null,closed:null}],ops:[]})}
        else if(tp==="savings"){const bank=fv("bank"),a=fnum("amount"),rt=fnum("rate");if(!bank||!a||rt===null)return"Заполните банк, сумму и ставку.";const open=fv("open")||today();
          S.placements.push({id:uid(),type:"savings",bank,owner:fv("owner"),currency:"RUB",notes:fv("notes"),tranches:[{id:uid(),open,end:null,target:null,amount:a,payFreq:1,payDay:fv("payDay")||null,incomplete:false,prevId:null,closed:null,rates:[fv("rk")==="ks"?{from:open,kind:"ks",spread:rt}:{from:open,kind:"sav",value:rt}]}],ops:[]})}
        else{const name=fv("name"),q=fnum("qty"),c=fnum("cpn"),cd=fv("cdate");if(!name||!q||c===null||!cd)return"Заполните выпуск, количество, дату и сумму купона.";
          S.placements.push({id:uid(),type:"bond",bank:name,name,isin:fv("isin"),owner:fv("owner"),currency:fv("cur"),nominal:fnum("nominal")||1000,qty0:q,since:pre.open||today(),freq:+fv("freq"),floating:fv("fl"),maturity:fv("mat")||null,offers:fv("offer")?[fv("offer")]:[],notes:"",coupons:[{date:cd,perBond:c,est:fv("fl")}],ops:[],closed:null})}
      },"Добавить");
      if(pre.pending)dlg.dataset.pending=pre.pending;
      $("#ptype").onchange=e=>draw(e.target.value);if(type==="deposit")wireRates();};
    draw(pre.type||"deposit");
  },
  prolong(pid,tid){const p=P(pid),t=p.tranches.find(x=>x.id===tid),e=tEnd(t)||today(),last=rateEntry(t,addDays(e,-1));
    const nt={open:e,amount:Math.round(amountAt(p,t,addDays(e,-1))),payFreq:t.payFreq,payDay:t.payDay||null,rates:[last&&last.kind==="ks"?{from:e,kind:"ks",spread:last.spread}:{from:e,kind:"fixed",value:rateAt(t,addDays(e,-1))}]};
    modal("Пролонгация: "+p.bank,`<p class="muted" style="margin-top:0">Новый транш будет связан с предыдущим (${fd(t.open)} — ${fd(e)}).</p>`+trancheFields(nt,p,false),()=>{
      const r=readTranche();if(r.err)return r.err;if(r.incomplete)return"Укажите даты нового транша.";
      p.tranches.push({id:uid(),...r,prevId:t.id,closed:null});t.closed={date:r.open<e?r.open:e,via:"prolong"};S.acks["end:"+t.id]={answer:"prolong",at:today()}},"Сохранить пролонгацию");wireRates()},
  closeEnd(pid,tid,fromCard){const p=P(pid),t=p.tranches.find(x=>x.id===tid);t.closed={date:tEnd(t)||today(),via:"close",answer:null};S.acks["end:"+t.id]={answer:"close",at:today()};save();render();if(fromCard||t.closed.date<=addDays(today(),-3))A.money(pid,tid)},
  earlyClose(pid,tid){const p=P(pid),t=p.tranches.find(x=>x.id===tid);modal("Закрыть: "+p.bank,`<div class="f"><label>Дата закрытия<input type="date" name="d" value="${today()}"></label></div><p class="muted">Через 3 дня приложение спросит, что стало с деньгами.</p>`,()=>{const d=fv("d");if(!d)return"Укажите дату.";t.closed={date:d,via:"close",answer:null};S.acks["end:"+t.id]={answer:"close",at:today()}},"Закрыть")},
  money(pid,tid){const p=P(pid),t=tid?p.tranches.find(x=>x.id===tid):null;const cd=(t?t.closed:p.closed).date;
    const total=Math.round(t?amountAt(p,t,addDays(cd,-1)):qtyAt(p,addDays(cd,-1))*p.nominal*fx(p));
    modal("Что стало с деньгами: "+(p.name||p.bank),`<p style="margin-top:0">Сумма к распределению: <b>${money(total)}</b> (закрыт ${fd(cd)}). Можно разбить на части.</p>${partsUI(total,pid)}`,()=>{
      const r=readParts(total);if(r.err)return r.err;(t?t.closed:p.closed).answer={parts:r.parts,at:today()};S.acks["money:"+(tid||pid)]={answer:"done",at:today()};applyParts(r.parts,p.owner,cd,p.name||p.bank)},"Сохранить");wireParts(total)},
  closeActive(pid,tid){const p=P(pid),t=p.tranches.find(x=>x.id===tid),t0=today(),full=Math.round(amountAt(p,t,t0));
    modal("Закрыть или забрать часть: "+p.bank,`<div class="f"><label>Дата<input type="date" name="d" value="${t0}"></label><label>Сумма, ₽ (вся — ${money(full)})<input name="amt" id="camt" inputmode="decimal" value="${full}"></label></div><p class="muted" style="font-size:13px;margin:8px 0">Вся сумма — вклад закрывается. Часть — вклад продолжает действовать с уменьшенной суммой.</p><h3 style="font-size:14px;margin:12px 0 6px">Что стало с этими деньгами</h3>${partsUI(full,pid)}`,()=>{
      const d=fv("d"),a=fnum("amt");if(!d||!a||a<=0)return"Укажите дату и сумму.";if(t.open&&d<t.open)return"Дата раньше открытия вклада.";
      const fullAt=amountAt(p,t,d);if(a>fullAt+0.5)return`Сумма больше, чем на вкладе (${money(fullAt)}).`;
      const r=readParts(a);if(r.err)return r.err;const ans={parts:r.parts,at:t0};
      if(a>=fullAt-0.5){t.closed={date:d,via:"close",answer:ans};S.acks["end:"+t.id]={answer:"close",at:t0}}
      else p.ops.push({id:uid(),trancheId:t.id,date:d,kind:"withdraw",amount:a,answer:ans});
      applyParts(r.parts,p.owner,d,p.bank)},"Сохранить");
    wireParts(full);$("#camt").oninput=e=>{const v=parseFloat(e.target.value.replace(/\s/g,"").replace(",","."));const rows=$("#mrows").children;if(rows.length===1&&!isNaN(v))rows[0].querySelector('[data-m="a"]').value=v}},
  bondClose(pid,date,key,fromCard){const p=P(pid);p.closed={date,answer:null};S.acks[key]={answer:"closed",at:today()};save();render();if(fromCard||date<=addDays(today(),-3))A.money(pid,"")},
  rateSame(pid,key){const p=P(pid),t=activeTranche(p,today()),cur=rateEntry(t,today());if(!(cur&&cur.kind==="ks"))t.rates.push({from:today(),kind:"sav",value:Math.round(rateAt(t,today())*100)/100});if(key)S.acks[key]={answer:"same",at:today()};save();render()},
  rateNew(pid,key){const p=P(pid),t=activeTranche(p,today()),cur=rateEntry(t,today()),isKs=cur&&cur.kind==="ks";
    modal("Новая ставка: "+p.bank,`<div class="f"><label>С даты<input type="date" name="d" value="${today()}"></label><label>Тип ставки<select name="rk"><option value="sav">Ставка банка, %</option><option value="ks" ${isKs?"selected":""}>Ключевая ставка ± спред, п.п.</option></select></label><label>Ставка, % — или спред к КС, п.п.<input name="v" inputmode="decimal" value="${isKs?cur.spread:Math.round(rateAt(t,today())*100)/100}"></label></div>`,()=>{const d=fv("d"),v=fnum("v");if(!d||v===null)return"Укажите дату и значение.";t.rates.push(fv("rk")==="ks"?{from:d,kind:"ks",spread:v}:{from:d,kind:"sav",value:v});if(key)S.acks[key]={answer:"new",at:today()}})},
  editTranche(pid,tid){const p=P(pid),t=p.tranches.find(x=>x.id===tid);
    if(p.type==="savings"){modal("Данные: "+p.bank,`<div class="f"><label>Банк и название счёта<input name="bank" value="${esc(p.bank)}"></label><label>Владелец${ownerSel(p.owner)}</label><label>Дата открытия<input type="date" name="open" value="${t.open||""}"></label><label>Сумма при открытии, ₽<input name="amount" inputmode="decimal" value="${t.amount}"></label><label>День выплаты процентов${payDaySel(t.payDay||"")}</label><label></label><label class="w">Заметки<textarea name="notes" rows="2">${esc(p.notes)}</textarea></label></div><p class="muted" style="font-size:13px">Ставка меняется кнопкой «Новая ставка» в карточке — так сохраняется история.</p>`,()=>{const bank=fv("bank"),a=fnum("amount");if(!bank||!a)return"Укажите банк и сумму.";p.bank=bank;p.owner=fv("owner");p.notes=fv("notes");t.open=fv("open")||t.open;t.amount=a;t.payDay=fv("payDay")||null});return}
    modal("Данные: "+p.bank,trancheFields(t,p,true),()=>{const bank=fv("bank");if(!bank)return"Укажите банк.";const r=readTranche();if(r.err)return r.err;p.bank=bank;p.owner=fv("owner");p.notes=fv("notes");Object.assign(t,r)});wireRates()},
  op(pid,kind){const p=P(pid),isB=p.type==="bond";const L={topup:"Пополнение",withdraw:"Частичное изъятие",buy:"Покупка",sell:"Продажа"};
    modal(L[kind]+": "+(p.name||p.bank),`<div class="f"><label>Дата<input type="date" name="d" value="${today()}"></label><label>${isB?"Количество, шт.":"Сумма, ₽"}<input name="v" inputmode="decimal"></label></div>`,()=>{const d=fv("d"),v=fnum("v");if(!d||!v||v<=0)return"Укажите дату и значение.";
      if(isB){if(kind==="sell"&&v>qtyAt(p,d))return"Нельзя продать больше, чем есть.";p.ops.push({id:uid(),date:d,kind,qty:v})}else{const t=activeTranche(p,d);if(!t)return"На эту дату нет действующего транша.";if(kind==="withdraw"&&v>=amountAt(p,t,d))return"Для изъятия всей суммы используйте «Закрыть».";p.ops.push({id:uid(),trancheId:t.id,date:d,kind,amount:v})}})},
  editBond(pid){const p=P(pid),next=couponSchedule(p).find(c=>c.date>=today());modal("Облигация: "+p.name,`<div class="f"><label>Выпуск<input name="name" value="${esc(p.name)}"></label><label>ISIN<input name="isin" value="${esc(p.isin)}"></label><label>Погашение<input type="date" name="mat" value="${p.maturity||""}"></label><label>Оферта<input type="date" name="offer" value="${p.offers[0]||""}"></label><label>Оценка купона на бумагу (для будущих выплат)<input name="cpn" inputmode="decimal" value="${next?next.perBond:""}"></label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="fl" ${p.floating?"checked":""}> плавающий купон</label></div>`,()=>{
    p.name=p.bank=fv("name")||p.name;p.isin=fv("isin");p.maturity=fv("mat")||null;p.offers=fv("offer")?[fv("offer")]:[];p.floating=fv("fl");const c=fnum("cpn");
    if(c!==null){const t0=today();let has=false;p.coupons.forEach(x=>{if(x.date>=t0){x.perBond=c;x.est=true;has=true}});if(!has){const sch=couponSchedule(p),n=sch.find(x=>x.date>=t0);if(n)p.coupons.push({date:n.date,perBond:c,est:true})}}})},
  newEvent(pid){modal("Новое событие",`<div class="f"><label>Дата<input type="date" name="d" value="${today()}"></label><label>Тип<select name="c"><option value="must">Обязательное — нужно что-то сделать</option><option value="info">Информационное</option></select></label><label class="w">Что сделать или о чём помнить<input name="t" placeholder="напр. Сообщить банку о продлении тарифа"></label><label class="w">Размещение<select name="p"><option value="">— не связано —</option>${S.placements.map(x=>`<option value="${x.id}" ${x.id===pid?"selected":""}>${esc(x.name||x.bank)} · ${x.owner}</option>`).join("")}</select></label></div>`,()=>{const d=fv("d"),t=fv("t");if(!d||!t)return"Укажите дату и текст.";S.events.push({id:uid(),date:d,cls:fv("c"),text:t,pid:fv("p")||null})},"Добавить")},
  delEvent(id){S.events=S.events.filter(e=>e.id!==id);save();A.card(dlg.dataset.pid)},
  delPlacement(pid){if(!confirm("Удалить размещение со всей историей?"))return;S.placements=S.placements.filter(x=>x.id!==pid);S.events=S.events.filter(e=>e.pid!==pid);save();dlg.close();render()},
  ksDel(i){S.settings.keyRates.splice(i,1);save();render()},
  card(pid){const p=P(pid);if(!p)return;dlg.dataset.pid=pid;const t0=today();
    const rtxt=t=>[...t.rates].sort((a,b)=>a.from<b.from?-1:1).map(r=>(r.from>"2000-01-01"?"с "+fd(r.from)+": ":"")+(r.kind==="ks"?`КС ${r.spread>=0?"+":"−"} ${Math.abs(r.spread)} п.п.`:r.kind==="sav"?pct(r.value)+" (введено)":pct(r.value))).join("; ");
    const ev=S.events.filter(e=>e.pid===pid);let body="",acts="";
    if(p.type!=="bond"){const at=activeTranche(p,t0);
      body=`<p style="margin-top:0">${TYPE[p.type]} · ${p.owner}${p.notes?`<br><span class="muted">${esc(p.notes)}</span>`:""}</p><h3 style="font-size:14px;margin:12px 0 0">История траншей</h3><ul class="chain">${[...p.tranches].sort((a,b)=>(a.open||"")<(b.open||"")?1:-1).map(t=>`<li><b>${fd(t.open)} — ${fd(t.end)}</b>${t.target?` · забрать ${fd(t.target)}`:""}${t===at?' <span class="tag">действует</span>':""}${t.incomplete?' <span class="tag w">неполные данные</span>':""}<br>${money(t.amount)} · ${rtxt(t)} · проценты ${payDayText(t)}${t.payFreq===3?", раз в квартал":""}${t===at?` · сейчас ${pct(rateAt(t,t0))}`:""}${t.closed?`<br><span class="muted">${t.closed.via==="prolong"?"пролонгирован":"закрыт "+fd(t.closed.date)}${t.closed.answer?": "+partsText(t.closed.answer.parts):t.closed.via==="close"?" — не указано, что стало с деньгами":""}</span>`:""}</li>`).join("")}</ul>
      ${p.ops.length?`<h3 style="font-size:14px;margin:12px 0 4px">Операции</h3><ul>${p.ops.map(o=>`<li>${fd(o.date)}: ${o.kind==="topup"?"пополнение":"изъятие"} ${money(o.amount)}${o.answer?" → "+partsText(o.answer.parts):""}</li>`).join("")}</ul>`:""}`;
      if(at)acts=`<button class="btn primary" onclick="A.closeActive('${pid}','${at.id}')">Закрыть или забрать часть</button>`+(p.type==="savings"?`<button class="btn" onclick="A.rateNew('${pid}')">Новая ставка</button>`:"")+`<button class="btn" onclick="A.op('${pid}','topup')">Пополнить</button><button class="btn" onclick="A.editTranche('${pid}','${at.id}')">Изменить данные</button>`;
      else{const le=lastEnded(p,t0);if(le&&!(le.t.closed&&(le.t.closed.answer||le.t.closed.via==="prolong")))acts=le.t.closed?`<button class="btn primary" onclick="A.money('${pid}','${le.t.id}')">Что стало с деньгами</button>`:(p.type==="deposit"?`<button class="btn primary" onclick="A.prolong('${pid}','${le.t.id}')">Пролонгирован</button>`:"")+`<button class="btn" onclick="A.closeEnd('${pid}','${le.t.id}',1)">Закрыт</button>`}
    }else{const sch=couponSchedule(p).filter(c=>c.date>=t0).slice(0,6);
      body=`<p style="margin-top:0">${p.owner} · ${num(qtyAt(p,t0))} шт. × ${p.nominal} ${p.currency==="USD"?"USD":"₽"}${p.isin?" · ISIN "+esc(p.isin):""}<br>${mkBond(p)?`<span class="new">Данные MOEX подгружены ${fd((mkBond(p).updatedAt||"").slice(0,10))}</span><br>`:p.isin?`<span class="chg">ISIN указан — данные MOEX появятся после ближайшей ежедневной задачи</span><br>`:`<span class="chg">Укажите ISIN («Изменить»), чтобы купоны подгружались с MOEX</span><br>`}Погашение: ${fd(p.maturity)}${p.offers.length?" · оферта "+p.offers.map(fd).join(", "):""}${p.floating?" · плавающий купон":""}${p.closed?`<br><b>Закрыта ${fd(p.closed.date)}</b>`:""}${p.notes?`<br><span class="muted">${esc(p.notes)}</span>`:""}</p>
      <h3 style="font-size:14px;margin:12px 0 4px">Ближайшие купоны</h3><ul>${sch.map(c=>`<li>${fd(c.date)}: ${c.perBond} ${p.currency==="USD"?"USD":"₽"} × ${num(qtyAt(p,c.date))} ≈ <span class="amt">${money(c.perBond*qtyAt(p,c.date)*fx(p))}</span>${c.est||p.floating?" (оценка)":""}</li>`).join("")||"<li>нет данных</li>"}</ul>
      ${p.ops.length?`<h3 style="font-size:14px;margin:12px 0 4px">Операции</h3><ul>${p.ops.map(o=>`<li>${fd(o.date)}: ${o.kind==="buy"?"покупка":"продажа"} ${num(o.qty)} шт.</li>`).join("")}</ul>`:""}`;
      if(p.closed&&!p.closed.answer)acts=`<button class="btn primary" onclick="A.money('${pid}','')">Что стало с деньгами</button>`;
      else if(!p.closed&&p.maturity&&p.maturity<=t0)acts=`<button class="btn primary" onclick="A.bondClose('${pid}','${p.maturity}','mat:${pid}',1)">Погашена</button>`;
      else if(!p.closed)acts=`<button class="btn" onclick="A.op('${pid}','buy')">Купить</button><button class="btn" onclick="A.op('${pid}','sell')">Продать</button><button class="btn" onclick="A.editBond('${pid}')">Изменить</button>`;}
    body+=`<h3 style="font-size:14px;margin:12px 0 4px">Свои события</h3>${ev.length?`<ul>${ev.map(e=>`<li>${fd(e.date)}: ${esc(e.text)} ${e.cls==="must"?'<span class="tag m">обязательное</span>':""} <button class="btn" onclick="A.delEvent('${e.id}')">Удалить</button></li>`).join("")}</ul>`:`<p class="muted" style="margin:0">нет</p>`}
      <div class="acts" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:16px">${acts}<button class="btn" onclick="A.newEvent('${pid}')">Добавить событие</button><button class="btn must" onclick="A.delPlacement('${pid}')">Удалить</button></div>`;
    modal(p.name||p.bank,body,null)}
};
/* ========== init ========== */
S=normalize(CACHE.data||emptyState());applyMarket(S);render();
if(SESS)pull();
setInterval(()=>{if(SESS)pull()},60000);
window.addEventListener("focus",()=>{if(SESS)pull()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&SESS)pull()});
window.addEventListener("online",()=>{if(SESS)pull()});
window.addEventListener("offline",()=>setSync("offline","нет сети — сохранено на устройстве"));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
